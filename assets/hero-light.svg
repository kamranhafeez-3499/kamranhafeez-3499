<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Kamran Hafeez — Full-Stack Software Engineer">
  <title>Kamran Hafeez — Full-Stack Software Engineer</title>
  <desc>Editorial hero, light variant: large name over a soft mint aurora, one gradient sweep animation.</desc>

  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#052e16"/>
      <stop offset="0.45" stop-color="#052e16"/>
      <stop offset="0.5"  stop-color="#059669"/>
      <stop offset="0.55" stop-color="#052e16"/>
      <stop offset="1"    stop-color="#052e16"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#f4fbf7"/>
    <g filter="url(#blur)" opacity="0.9">
      <ellipse cx="980" cy="90" rx="260" ry="150" fill="#a7f3d0">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 0 0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1120" cy="300" rx="300" ry="120" fill="#6ee7b7" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; -90 -40; 0 0" dur="27s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="180" cy="330" rx="260" ry="110" fill="#d1fae5">
        <animateTransform attributeName="transform" type="translate" values="0 0; 70 -20; 0 0" dur="25s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <rect width="1200" height="320" filter="url(#grain)" opacity="0.6"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#059669" stroke-opacity="0.25"/>
  </g>

  <g font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="3.5" fill="#059669">
    <text x="72" y="96">FULL-STACK SOFTWARE ENGINEER</text>
  </g>

  <text x="68" y="188" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3.5" fill="url(#sweep)">Kamran Hafeez</text>

  <rect x="72" y="214" width="56" height="2" rx="1" fill="#059669"/>
  <text x="72" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#065f46">Web3 · AI agents · cloud-native systems that hold up under Monday-morning traffic.</text>

  <g transform="translate(920, 72)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="0" y="0" width="208" height="34" rx="17" fill="#ffffff" fill-opacity="0.7" stroke="#059669" stroke-opacity="0.45"/>
    <circle cx="20" cy="17" r="4.5" fill="#059669">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="17" r="4.5" fill="none" stroke="#059669" stroke-width="1.5">
      <animate attributeName="r" values="4.5;11" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" font-size="13" font-weight="600" fill="#052e16" letter-spacing="0.2">Open to Senior / Staff roles</text>
  </g>

  <text x="1128" y="256" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#047857" fill-opacity="0.85">LAHORE · REMOTE · UTC+5</text>
</svg>

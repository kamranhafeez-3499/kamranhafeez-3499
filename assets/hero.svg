<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Kamran Hafeez — Full-Stack Software Engineer">
  <title>Kamran Hafeez — Full-Stack Software Engineer</title>
  <desc>Editorial hero: large name over a slowly drifting emerald aurora, one gradient sweep animation.</desc>

  <defs>
    <!-- aurora blobs: heavy blur, slow drift -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <!-- fine grain for texture; very low opacity -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <!-- gradient sweep through the name -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ecfdf5"/>
      <stop offset="0.45" stop-color="#ecfdf5"/>
      <stop offset="0.5"  stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#ecfdf5"/>
      <stop offset="1"    stop-color="#ecfdf5"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0a0f0d"/>

    <!-- aurora -->
    <g filter="url(#blur)" opacity="0.85">
      <ellipse cx="980" cy="90" rx="260" ry="150" fill="#065f46">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 0 0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1120" cy="300" rx="300" ry="120" fill="#10b981" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0; -90 -40; 0 0" dur="27s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="180" cy="330" rx="260" ry="110" fill="#064e3b" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 70 -20; 0 0" dur="25s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="620" cy="-40" rx="220" ry="90" fill="#022c22">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 30; 0 0" dur="30s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="1200" height="320" filter="url(#grain)" opacity="0.5"/>

    <!-- hairline frame -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#10b981" stroke-opacity="0.25"/>
  </g>

  <!-- overline -->
  <g font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="3.5" fill="#34d399">
    <text x="72" y="96">FULL-STACK SOFTWARE ENGINEER</text>
  </g>

  <!-- name -->
  <text x="68" y="188" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3.5" fill="url(#sweep)">Kamran Hafeez</text>

  <!-- rule + tagline -->
  <rect x="72" y="214" width="56" height="2" rx="1" fill="#10b981"/>
  <text x="72" y="252" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a7f3d0">Web3 · AI agents · cloud-native systems that hold up under Monday-morning traffic.</text>

  <!-- status pill -->
  <g transform="translate(920, 72)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="0" y="0" width="208" height="34" rx="17" fill="#0a0f0d" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.45"/>
    <circle cx="20" cy="17" r="4.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="17" r="4.5" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="4.5;11" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="22" font-size="13" font-weight="600" fill="#ecfdf5" letter-spacing="0.2">Open to Senior / Staff roles</text>
  </g>

  <!-- location, bottom right, quiet -->
  <text x="1128" y="256" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#6ee7b7" fill-opacity="0.8">LAHORE · REMOTE · UTC+5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Kamran Hafeez — Full-Stack Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22">
        <animate attributeName="stop-color" values="#022c22;#064e3b;#022c22" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#064e3b">
        <animate attributeName="stop-color" values="#064e3b;#065f46;#064e3b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#022c22">
        <animate attributeName="stop-color" values="#022c22;#052e16;#022c22" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="600" cy="160" rx="500" ry="180" fill="url(#glow)"/>

  <g stroke="#10b981" stroke-width="1.2" fill="none" stroke-opacity="0.55">
    <line x1="120" y1="80"  x2="260" y2="140">
      <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="140" x2="180" y2="240">
      <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="140" x2="420" y2="90">
      <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="940" y1="80"  x2="1080" y2="140">
      <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1080" y1="140" x2="1020" y2="240">
      <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="1080" y1="140" x2="900" y2="230">
      <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="240" x2="420" y2="90"/>
    <line x1="900" y1="230" x2="1020" y2="240"/>
  </g>

  <g fill="#10b981">
    <circle cx="120"  cy="80"  r="4">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260"  cy="140" r="5">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180"  cy="240" r="3.5">
      <animate attributeName="r" values="2.5;5.5;2.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420"  cy="90"  r="3.5">
      <animate attributeName="r" values="3;6;3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940"  cy="80"  r="4">
      <animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="140" r="5">
      <animate attributeName="r" values="4;7;4" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="240" r="3.5">
      <animate attributeName="r" values="2.5;5.5;2.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900"  cy="230" r="3.5">
      <animate attributeName="r" values="3;6;3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle" filter="url(#softGlow)">
    <text x="600" y="150" fill="#ecfdf5" font-size="72" font-weight="800" letter-spacing="4">
      KAMRAN HAFEEZ
    </text>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">
    <text x="600" y="200" fill="#34d399" font-size="18" letter-spacing="6" font-weight="600">
      FULL-STACK  ·  WEB3  ·  AI  AGENTS  ·  CLOUD-NATIVE
    </text>
  </g>

  <g>
    <rect x="0" y="315" width="1200" height="2" fill="url(#accent)"/>
    <rect x="0" y="0"   width="1200" height="2" fill="url(#accent)"/>
  </g>

  <g transform="translate(600, 245)">
    <rect x="-60" y="-1" width="120" height="2" fill="#10b981" opacity="0.35"/>
    <circle cx="0" cy="0" r="3" fill="#34d399">
      <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

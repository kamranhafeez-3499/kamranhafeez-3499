name: Generate profile assets

# Regenerates the contribution snake and the self-hosted stats cards (streak + activity)
# and publishes them to the `output` branch, which the README embeds via raw URLs.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards (streak + activity)
        # Private contributions are included because "Private contributions" is enabled on the
        # profile; the built-in token is enough. Standard library only, no pip install.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: kamranhafeez-3499
        run: python scripts/build-stats.py dist

      # Runs AFTER the stats step: this action runs in Docker as root and leaves dist/ root-owned.
      - uses: Platane/snk@v3
        with:
          github_user_name: kamranhafeez-3499
          # Emerald theme matching the README (badges/hero): dots are empty->high activity.
          outputs: |
            dist/github-snake.svg?color_snake=#022c22&color_dots=#ecfdf5,#a7f3d0,#34d399,#10b981,#059669
            dist/github-snake-dark.svg?color_snake=#a7f3d0&color_dots=#0f1f18,#065f46,#059669,#10b981,#34d399

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: kamranhafeez-3499
          # Emerald theme matching the README (badges/hero): dots are empty->high activity.
          outputs: |
            dist/github-snake.svg?color_snake=#022c22&color_dots=#ecfdf5,#a7f3d0,#34d399,#10b981,#059669
            dist/github-snake-dark.svg?color_snake=#a7f3d0&color_dots=#0f1f18,#065f46,#059669,#10b981,#34d399

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
